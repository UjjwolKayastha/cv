name: Build and deploy CV

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # update the rolling "latest" release
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - name: Publish PDF to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tar -xf artifact.tar ./Ujjwol-Kayastha-CV.pdf
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest CV" --notes "Rebuilt automatically from cv.yaml on every push."
          gh release upload latest Ujjwol-Kayastha-CV.pdf --clobber
